# ==================================================
# API GATEWAY - TEST Environment (local localhost)
# ==================================================
# CORS: frontend CRA on http://localhost:3000
# Routes: /api/<service>/** (StripPrefix=1) for frontend + /<service>/** direct

spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOriginPatterns=http://localhost:3000,http://127.0.0.1:3000,http://10.22.118.224:3000,http://10.*.*.*:3000,http://192.168.*.*:3000
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true

# Eureka URL
eureka.client.service-url.defaultZone=http://localhost:7777/eureka

# AUTH-SERVICE
spring.cloud.gateway.routes[0].id=AUTH-SERVICE-API
spring.cloud.gateway.routes[0].uri=http://localhost:7779
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth-service/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.routes[1].id=AUTH-SERVICE
spring.cloud.gateway.routes[1].uri=http://localhost:7779
spring.cloud.gateway.routes[1].predicates[0]=Path=/auth-service/**

