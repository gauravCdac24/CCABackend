# CORS Configuration (Origin for http://10.212.168.168/ is without :80)
# https://esignservice.cdac.in is C-DAC's eSign provider, which posts the signed
# response back to /esign-service/esignresponse as a cross-site form submission.
# Without it in this allowlist, the gateway's own CorsWebFilter rejects the
# callback with a bare 403 before it ever reaches esign-service.
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origin-patterns[0]=https://ccalms.cca.gov.in
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origin-patterns[1]=https://45.127.74.108:443
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origin-patterns[2]=https://esignservice.cdac.in

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-credentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*

# Eureka URL
#eureka.client.service-url.defaultZone=http://127.0.0.1:7777/eureka

# Gateway Routes
# - /api/<service>/**  : nginx/frontend style; StripPrefix=1 removes /api
# - /<service>/**      : direct/internal style (no strip)
# Both forward to the same backend service paths.

# AUTH-SERVICE
spring.cloud.gateway.routes[0].id=AUTH-SERVICE-API
spring.cloud.gateway.routes[0].uri=http://10.212.168.180:7779
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth-service/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1

