# ==================================================
# NOTIFICATION SERVICE - Base Configuration
# ==================================================
# Profile Selection: Use -Dspring.profiles.active=local|dev|test|uat
# Default profile is 'local' - override with command line or env variable

spring.profiles.active=dev

spring.application.name=NOTIFICATION-SERVICE

# Server Configuration
server.port=7780
server.servlet.session.cookie.same-site=strict

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true
spring.jpa.show-sql=true
spring.jpa.database=postgresql
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# Datasource Driver
spring.datasource.driver-class-name=org.postgresql.Driver

# Email Configuration (SMTP)
spring.mail.host=smtp.mgovcloud.in
spring.mail.port=465
spring.mail.username=info@cca.gov.in
spring.mail.password=Password@@123
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.debug=true

# SMS API (MSDG DLT)
sms.api.url=https://msdgweb.mgov.gov.in/esms/sendsmsrequestDLT
sms.username=ccalmsdelhi
sms.password=cdac11@CCA
sms.sender-id=CCALMS
sms.secure-key=f043c8ac-8646-442f-bc47-876263243a92

# DLT content templates: config holds template ID + exact registered body.
# Callers pass only smsTemplateKey + smsVars (in placeholder order).
# Placeholders may be {#var#} or {#num#} (OTP).
# IMPORTANT: escape # as \# in .properties so it is not treated as a comment.

sms.templates.otp.id=1477178841413978234
sms.templates.otp.body=Please do not share your OTP with anyone, your OTP is {#num#}.

sms.templates.intent-registration.id=1407174244996769199
sms.templates.intent-registration.body=Dear {#var#}, your intent to become a Certifying Authority submitted successfully. You can login & submit the License Application using the login credentials sent to your registered email address. CCA-MeitY

sms.templates.license-application.id=1407174245138297647
sms.templates.license-application.body=Dear {#var#}, application no. {#var#} to become a Certifying Authority submitted successfully subject to scrutiny, review, audit & approval. CCA-MeitY

sms.templates.application-review.id=1407174245390975022
