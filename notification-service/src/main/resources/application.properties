# Logging
logging.level.root=INFO
logging.level.in.lms.cca=DEBUG
logging.level.javax.mail=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Springdoc/Swagger
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/notification-service/api-docs
springdoc.packages-to-scan=in.lms.cca.controller
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/notification-service/swagger-ui.html

# Eureka Client Config
eureka.instance.prefer-ip-address=false
eureka.client.fetch-registry=false
eureka.client.register-with-eureka=false
